[program:campaign-dispatcher]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/dashboard.chatberry.net
command=/usr/bin/php /var/www/dashboard.chatberry.net/artisan queue:work redis --queue=campaign-logs,campaign-dispatchers --sleep=1 --tries=3 --timeout=900 --memory=256
autostart=true
autorestart=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/campaign-dispatcher.log
stopwaitsecs=3600
startsecs=1
stopasgroup=true
killasgroup=true

