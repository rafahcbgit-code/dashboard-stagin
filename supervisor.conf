# /etc/supervisor/conf.d/laravel-queue.conf
#
# Split queues into dedicated workers for optimal performance.
# Campaign-messages gets highest concurrency since each carousel message
# involves Meta API calls (upload + send).

# Worker 1: General application queues (webhooks, notifications, etc.)
[program:laravel-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dashboard.chatberry.net/artisan queue:work redis --queue=default,webhook-status --sleep=3 --tries=3 --timeout=300 --memory=128
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/laravel-default.log

# Worker 2: Campaign log creation (lightweight, runs once per campaign)
[program:laravel-campaign-logs]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dashboard.chatberry.net/artisan queue:work redis --queue=campaign-logs --sleep=3 --tries=3 --timeout=600 --memory=256
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/laravel-campaign-logs.log

# Worker 3: Campaign message sending (high throughput — needs concurrency)
# Each worker processes one message at a time, so numprocs=5 allows 5 messages in parallel.
# For carousel campaigns, this is critical since each message may take 1-3s.
# Increase to 8-10 for very large campaigns if server resources allow.
[program:laravel-campaign-messages]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dashboard.chatberry.net/artisan queue:work redis --queue=campaign-messages --sleep=1 --tries=3 --timeout=600 --memory=256
autorestart=true
numprocs=5
redirect_stderr=true
stdout_logfile=/var/log/laravel-campaign-messages.log


